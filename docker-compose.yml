# Local 3-broker Kafka cluster in KRaft mode (no ZooKeeper).
#
# Every node is both broker and controller, so the controller quorum
# survives the loss of any one node (2 of 3 votes remain).
#
# Listeners:
#   INTERNAL   kafkaN:19092   broker <-> broker traffic inside the Docker network
#   CONTROLLER kafkaN:9093    KRaft quorum traffic
#   EXTERNAL   localhost:9092/9094/9096  clients on the host (transmitters, switchboard)
#
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to wipe data)

x-kafka-common: &kafka-common
  image: apache/kafka:3.9.1
  restart: unless-stopped
  environment: &kafka-env
    # Any 16 bytes, base64url-encoded (22 chars); identical on all three nodes.
    CLUSTER_ID: "ZHJhZ29uZmx5LWxvY2FsMQ"
    # Store data on the named volume (the image default is /tmp/kafka-logs,
    # which would be lost on "docker compose down").
    KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
    KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
    # Durability defaults for the fault-tolerance demo.
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    # Keep three JVMs friendly to a laptop.
    KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  kafka1:
    <<: *kafka-common
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:19092,EXTERNAL://localhost:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:19092,EXTERNAL://localhost:9094"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9096:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka3:19092,EXTERNAL://localhost:9096"
    volumes:
      - kafka3-data:/var/lib/kafka/data

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
